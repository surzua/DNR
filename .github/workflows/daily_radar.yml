name: Daily Data Newsjacking Radar

on:
  schedule:
    # Corre todos los días a las 10:23 UTC (07:23 AM CLT en UTC-3 / 06:23 AM CLT en UTC-4) para evitar la congestión en :00 y :30
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular despacho a Telegram (consola de GitHub Actions)'
        type: boolean
        required: false
        default: false
      skip_llm:
        description: 'Omitir fase de evaluación con Gemini'
        type: boolean
        required: false
        default: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Radar Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SKIP_LLM: ${{ github.event.inputs.skip_llm }}
        run: |
          CMD="python main.py"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "$INPUT_SKIP_LLM" = "true" ]; then
            CMD="$CMD --skip-llm"
          fi
          echo "Ejecutando: $CMD"
          $CMD

      - name: Commit and push history updates
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update radar history [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push origin main
          else
            echo "Sin cambios en data/history.json para commitear."
          fi

      - name: Notify Failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python3 -c '
          import os, urllib.request, json
          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          run_url = os.environ.get("RUN_URL", "")
          if token and chat_id:
              msg = f"🚨 <b>DNR Error en GitHub Actions</b>\n\nEl radar diario falló durante su ejecución.\n👉 <a href=\"{run_url}\">Ver registro de errores en Actions</a>"
              payload = json.dumps({"chat_id": chat_id, "text": msg, "parse_mode": "HTML"}).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"}
              )
              try:
                  urllib.request.urlopen(req, timeout=10)
              except Exception:
                  pass
          ' || true
          fi
