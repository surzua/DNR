rss_feeds:
  la_tercera:
    name: "La Tercera"
    categories:
      nacional: "https://www.latercera.com/arc/outboundfeeds/rss/category/nacional/?outputType=xml"
      politica: "https://www.latercera.com/arc/outboundfeeds/rss/category/politica/?outputType=xml"
      pulso: "https://www.latercera.com/arc/outboundfeeds/rss/category/pulso/?outputType=xml"
  diario_financiero:
    name: "Diario Financiero"
    categories:
      portada: "https://www.df.cl/noticias/site/list/port/rss.xml"
  biobiochile:
    name: "BioBioChile"
    categories:
      portada: "https://feeds.feedburner.com/radiobiobio/NNeJ"
  cooperativa:
    name: "Radio Cooperativa"
    categories:
      portada: "https://cooperativa.cl/noticias/site/tax/port/all/rss____1.xml"

reddit:
  subreddits:
    - "chile"
    - "republicadechile"
  filters:
    min_score: 50
    min_comments: 30
    limit: 50
    time_filter: "day"

# RSS público comprobado para Chile (HTTP 200, XML válido y entradas con fecha).
trends:
  enabled: true
  limit: 10

# Señales previsibles añadidas manualmente con fecha y fuente oficial.
scheduled_events: []

pipeline:
  max_hours_lookback: 24
  history_days_lookback: 2
  max_opportunities_to_notify: 3
  min_virality_score: 7
  min_feasibility_score: 6
  # La comprobación HTTP solo registra acceso técnico, no valida afirmaciones.
  verify_source_urls: true
  # Las propuestas prometedoras pendientes de revisión no se descartan por una URL caída.
  require_accessible_source: false
  source_verification_timeout_seconds: 10
